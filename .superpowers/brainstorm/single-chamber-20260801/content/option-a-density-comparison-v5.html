<h2>ProjectRift 舰船大厅：功能密度调整</h2>
<p class="subtitle">两版维持相近尺度；v5 通过有效设施和结构层级消除空旷感，而不是重新缩小房间。</p>

<div class="pair">
  <div class="shot">
    <img src="/files/option-a-five-cryopods-grand-v4.png" alt="v4 扩大但较空的舰船大厅">
    <div class="shot-body"><h3>v4 · 尺度到位，功能偏空</h3><p>环形面积足够，但大部分地面与高处只有尺度，没有与游戏操作相对应的内容。</p></div>
  </div>
  <div class="shot selected">
    <img src="/files/option-a-functional-density-v5.png" alt="v5 大尺度且具有功能密度的舰船大厅">
    <div class="shot-body"><h3>v5 · 大尺度 + 功能层级</h3><p>扩大中央任务岛，加入外围功能台、构造体停机位、分段设备舱和顶部服务环，同时保留清晰主通道。</p></div>
  </div>
</div>

<div class="points">
  <div class="point"><b>地面层</b><span>环形通道、四向操作区、低矮功能岛和服务沟槽。</span></div>
  <div class="point"><b>舱壁层</b><span>重复结构肋与可替换设备舱形成模块化建模基准。</span></div>
  <div class="point"><b>顶部层</b><span>服务与照明环补足纵向体积，但不是可行走二层。</span></div>
</div>
